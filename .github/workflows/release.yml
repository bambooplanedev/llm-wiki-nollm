name: Release

# A `v*` tag builds the release binary for Linux and both macOS targets and
# attaches the tarballs and their SHA256SUMS to a GitHub Release whose notes
# are generated from the commits since the previous tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          [ "v$version" = "$TAG" ] || { echo "tag $TAG does not match v$version in Cargo.toml"; exit 1; }
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: >
          tar -C target/${{ matrix.target }}/release
          -czf kalka-${{ github.ref_name }}-${{ matrix.target }}.tar.gz kalka
      - uses: actions/upload-artifact@v7
        with:
          name: kalka-${{ matrix.target }}
          path: kalka-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Download each artifact by name: a name that is not listed yet fails the
      # step, whereas a pattern or merge-multiple download silently takes a short list.
      - uses: actions/download-artifact@v8
        with:
          name: kalka-x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@v8
        with:
          name: kalka-aarch64-apple-darwin
      - uses: actions/download-artifact@v8
        with:
          name: kalka-x86_64-apple-darwin
      - name: Check all three tarballs are present
        run: '[ "$(ls kalka-*.tar.gz | wc -l)" -eq 3 ] || { echo "expected 3 tarballs"; ls; exit 1; }'
      - run: sha256sum kalka-*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            kalka-*.tar.gz
            SHA256SUMS
