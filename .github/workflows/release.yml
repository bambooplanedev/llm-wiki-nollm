name: Release

# A `v*` tag builds the release binary for Linux and both macOS targets and
# attaches the tarballs to a GitHub Release whose notes are generated from
# the commits since the previous tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: wiki
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wiki
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - run: >
          tar -C target/${{ matrix.target }}/release
          -czf wiki-${{ github.ref_name }}-${{ matrix.target }}.tar.gz wiki
      - uses: actions/upload-artifact@v7
        with:
          name: wiki-${{ matrix.target }}
          path: wiki/wiki-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: wiki-*.tar.gz
