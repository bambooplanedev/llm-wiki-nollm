name: Rust

on:
  push:
    branches: [ "main" ]
  # Every pull request, so each PR of a stack is checked, not only the one into main.
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: Swatinem/rust-cache@v2
    - name: Check formatting
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Run tests
      run: cargo test --verbose
    - name: Test strip-chrome.awk
      run: bash scripts/test-strip-chrome.sh
    - name: Check install.sh syntax
      run: sh -n install.sh
    - name: Docs
      run: cargo doc --no-deps
      env:
        RUSTDOCFLAGS: -D warnings
