[package]
name = "wiki-code"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Code layer shared by the wiki compiler: the item model and source tree walk"
license = "MIT"
publish = false

[dependencies]
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
tree-sitter = "0.27"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"

[lints]
workspace = true
