[package]
name = "wiki"
version = "0.6.0"
edition = "2021"
rust-version = "1.88"
description = "Deterministic wiki compiler for agent-navigable knowledge bases"
license = "MIT"
publish = false

[[bin]]
name = "wiki"
path = "src/main.rs"

[lib]
name = "wiki"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
blake3 = "1"
ignore = "0.4"
regex = "1"
notify = "8"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-cpp = "0.23"
rmcp = { version = "3", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["rt"] }
frostem = { version = "=2.20261016.1", default-features = false, features = ["english", "ukrainian"] }

[dev-dependencies]
insta = "1"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
criterion = "0.8"

[[bench]]
name = "pipeline"
harness = false

[profile.release]
strip = true

[lints.rust]
unsafe_code = "forbid"

# Pedantic on, with the lints that would fight this codebase switched off:
# - must_use_candidate: noise on ~30 plain constructors and accessors.
# - cast_precision_loss / cast_possible_truncation: every cast is a
#   deliberate usize -> f64 for scoring or PageRank.
# - too_many_lines: `main` is a flat clap match and stays that way.
# - missing_errors_doc / missing_panics_doc: `publish = false`, no external
#   API surface to document for.
# - format_push_string: `write!` into a String reads worse than
#   `push_str(&format!(..))` and needs a `Result` nobody checks.
# - module_name_repetitions: `WikiError`, `WikiState` are the clear names.
# - unused_async_trait_impl: rmcp's trait signatures are async whether we await or not.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
format_push_string = "allow"
module_name_repetitions = "allow"
unused_async_trait_impl = "allow"
