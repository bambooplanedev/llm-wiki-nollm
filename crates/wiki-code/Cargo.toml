[package]
name = "wiki-code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Code layer shared by the wiki compiler and its sibling tools: the item model, source tree walk, tree-sitter extraction, call-site index and import resolution"
license.workspace = true
publish = false

[dependencies]
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
# Exact grammar and tree-sitter versions: a git dependency's lock file is
# ignored by its consumer, and a grammar bump changes what is extracted.
tree-sitter = "=0.27.2"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-go = "=0.25.0"
tree-sitter-bash = "=0.25.1"
tree-sitter-cpp = "=0.23.4"

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"

[lints]
workspace = true
